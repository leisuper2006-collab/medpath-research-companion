services:
  api:
    image: python:3.11-slim
    working_dir: /app/apps/api
    volumes:
      - ./:/app
    command: sh -c "pip install -r requirements.txt && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
  web:
    image: python:3.11-slim
    working_dir: /app/apps/api
    volumes:
      - ./:/app
    command: sh -c "pip install -r requirements.txt && python -m uvicorn app.main:app --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"

